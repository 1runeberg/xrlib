# xrlib

name: steamos-releases

on:
  push:
    tags:
      - 'v*.*.*.*'


jobs:
    build-shared:
        uses: ./.github/workflows/_src_steamos_builds.yml
        with:
          matrix-json: >
            {
              "build_type": ["Release"],
              "cpp_compiler": ["g++", "clang++"],
              "enable_xrvk": ["ON", "OFF"]
            }
          build-as-static : "OFF"
          export-artifacts: "ON"

    build-static:
        uses: ./.github/workflows/_src_steamos_builds.yml
        with:
          matrix-json: >
            {
              "build_type": ["Release"],
              "cpp_compiler": ["g++", "clang++"],
              "enable_xrvk": ["ON", "OFF"]
            }
          build-as-static : "ON"
          export-artifacts: "ON"

    package-release:
        runs-on: ubuntu-latest
        needs: [build-shared, build-static]
        strategy:
          matrix:
            include:
              - library_type: shared
                build_as_static: "OFF"
              - library_type: static
                build_as_static: "ON"
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                name: xrlib-steamos-arm64_compiler_g++_static_${{ matrix.build_as_static }}-xrvk_ON
                path: ${{ github.ref_name }}_xrlib_binaries_steamos-arm64-${{ matrix.library_type }}/gnu/with_renderer

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                name: xrlib-steamos-arm64_compiler_g++_static_${{ matrix.build_as_static }}-xrvk_OFF
                path: ${{ github.ref_name }}_xrlib_binaries_steamos-arm64-${{ matrix.library_type }}/gnu/no_renderer

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                name: xrlib-steamos-arm64_compiler_clang++_static_${{ matrix.build_as_static }}-xrvk_ON
                path: ${{ github.ref_name }}_xrlib_binaries_steamos-arm64-${{ matrix.library_type }}/clang/with_renderer

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                name: xrlib-steamos-arm64_compiler_clang++_static_${{ matrix.build_as_static }}-xrvk_OFF
                path: ${{ github.ref_name }}_xrlib_binaries_steamos-arm64-${{ matrix.library_type }}/clang/no_renderer

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: xrlib-${{ github.ref_name }}-steamos-arm64-${{ matrix.library_type }}-libs
                path: ./${{ github.ref_name }}_xrlib_binaries_steamos-arm64-${{ matrix.library_type }}
                if-no-files-found: error

            - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
              with:
                name: xrlib-steamos-arm64_compiler_*_static_${{ matrix.build_as_static }}-xrvk_*
                failOnError: false
